name = "FAA2026"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FAA2026"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[require]]
name = "mathlib"
scope = "leanprover"
rev = "v4.36.0"

[[require]]
name = "waterfall"
git = "https://www.github.com/samth/waterfall.git"
rev = "v0.2.0"

[[lean_lib]]
name = "FAA2026"
